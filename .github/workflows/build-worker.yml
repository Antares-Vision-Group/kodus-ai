name: Build & push worker image

on:
  push:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - 'libs/**'
      - 'packages/**'
      - 'docker/Dockerfile'
      - 'docker-bake.hcl'
      - '.github/workflows/build-worker.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/antares-vision-group/kodus-ai-worker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push worker image
        uses: docker/bake-action@v6
        with:
          files: docker-bake.hcl
          targets: worker
          push: true
        env:
          WORKER_TAGS: ${{ env.IMAGE_NAME }}:latest,${{ env.IMAGE_NAME }}:${{ github.sha }}
          API_CLOUD_MODE: "false"
          RELEASE_VERSION: ${{ github.sha }}
          CACHE_SCOPE: kodus-ai-worker
